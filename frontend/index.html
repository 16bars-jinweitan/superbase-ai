<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coke ON Analytics</title>
  <script src="assets/js/config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<header>
  <div class="logo">
    <!-- Coca-Cola bottle silhouette SVG -->
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="16" cy="16" r="15" fill="white" fill-opacity="0.2"/>
      <text x="16" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="sans-serif">ON</text>
    </svg>
    <span class="logo-text" data-i18n="title">Coke ON Analytics</span>
  </div>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button class="lang-btn active" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">JP</button>
  </div>
</header>

<main>
  <div class="split-layout">
    <div class="left-panel">
      <div class="card">
        <div class="card-title" data-i18n="suggestionsLabel">Try asking</div>

        <div class="suggestions" id="suggestions"></div>

        <div class="query-row">
          <textarea
            id="queryInput"
            rows="3"
            data-i18n-placeholder="placeholder"
          ></textarea>
          <button class="submit-btn" id="submitBtn" onclick="submitQuery()">
            <span class="spinner" id="spinner"></span>
            <span data-i18n="submit">Ask</span>
          </button>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="response-card" id="responseCard">
        <div class="response-header" data-i18n="responseLabel">Answer</div>
        <div class="response-body" id="responseBody"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span data-i18n="footer">Coke ON Analytics POC — synthetic data only</span>
</footer>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  // Edit frontend/config.js to change the webhook URL.
  const WEBHOOK_URL = CONFIG.WEBHOOK_URL;

  // ── i18n strings ─────────────────────────────────────────────────────────
  const STRINGS = {
    en: {
      title: "Coke ON Analytics",
      suggestionsLabel: "Try asking",
      placeholder: "Ask a question about Coke ON users, sales, or app activity…",
      submit: "Ask",
      responseLabel: "Answer",
      footer: "Coke ON Analytics POC — synthetic data only",
      loading: "Thinking…",
      errorNetwork: "Could not reach the analytics service. Is n8n running?",
      errorServer: "The service returned an error. Please try again.",
    },
    ja: {
      title: "Coke ON アナリティクス",
      suggestionsLabel: "例えばこんな質問",
      placeholder: "Coke ONのユーザー、売上、アプリ活動について質問してください…",
      submit: "質問する",
      responseLabel: "回答",
      footer: "Coke ON アナリティクス POC — 合成データのみ",
      loading: "考え中…",
      errorNetwork: "サービスに接続できません。n8nは起動していますか？",
      errorServer: "サービスでエラーが発生しました。もう一度お試しください。",
    },
  };

  const SUGGESTIONS = {
    en: [
      {
        label: "Segment",
        items: [
          "Show a day to day graph of % of new users making their first purchase.",
          "Is there a \"magic number\" of purchases in the first 30 days that predicts long-term retention in Monthly+ or above?",
        ],
      },
      {
        label: "Drink Preference",
        items: [
          "What are the top 5 products purchased by each primary segment? Do preferences diverge significantly across segments?",
          "Do Weekly+ and Daily+ users show narrower product loyalty (fewer SKUs) or broader exploration than Monthly− users?",
        ],
      },
      {
        label: "Demographics",
        items: [
          "How do drink preferences differ by age band (18–24, 25–34, 35–44, 45+) and gender?",
          "Are there clear generational preference shifts (e.g., Gen Z skewing toward non-carbonated)?",
        ],
      },
      {
        label: "Seasonal & Timing",
        items: [
          "Is there a weekday vs. weekend purchase gap? Which segments show the biggest drop-off on weekends?",
          "Are there \"Monday spike\" or \"Friday drop-off\" patterns that could inform push notification timing?",
        ],
      },
      {
        label: "Cross Category",
        items: [
          "If we could only personalise one dimension per user, which behavioural category delivers the highest incremental NSR?",
          "Which combination of behavioural signals best predicts a user's willingness to try a new product?",
        ],
      },
    ],
    ja: [
      {
        label: "セグメント",
        items: [
          "新規ユーザーが初回購入に至る割合の日次推移をグラフで表示してください。",
          "最初の30日間の購入回数に、Monthly+以上の長期定着を予測する「マジックナンバー」はありますか？",
        ],
      },
      {
        label: "飲料嗜好",
        items: [
          "主要セグメントごとの購入数トップ5商品は何ですか？セグメント間で嗜好に大きな違いはありますか？",
          "Weekly+やDaily+ユーザーはMonthly−ユーザーと比べて、少ないSKUに集中した購買をしますか、それとも幅広く探索しますか？",
        ],
      },
      {
        label: "デモグラフィック",
        items: [
          "年齢層（18〜24歳、25〜34歳、35〜44歳、45歳以上）と性別によって飲み物の好みはどう異なりますか？",
          "Z世代が非炭酸飲料を好むなど、明確な世代間の嗜好変化はありますか？",
        ],
      },
      {
        label: "季節・時間帯",
        items: [
          "平日と週末の購買ギャップはありますか？週末に最も大きく落ち込むセグメントはどれですか？",
          "月曜スパイクや金曜ドロップオフなど、プッシュ通知のタイミングに活かせるパターンはありますか？",
        ],
      },
      {
        label: "クロスカテゴリ",
        items: [
          "ユーザーごとに1つだけパーソナライズするなら、どの行動カテゴリが最も高い増分NSRをもたらしますか？",
          "ユーザーが新商品を試す意欲を最もよく予測する行動シグナルの組み合わせはどれですか？",
        ],
      },
    ],
  };

  // ── State ─────────────────────────────────────────────────────────────────
  let currentLang = "en";
  let isLoading = false;

  // ── Language ──────────────────────────────────────────────────────────────
  function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;

    // Update active button
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });

    // Update all i18n text nodes
    const strings = STRINGS[lang];
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = strings[el.dataset.i18n] ?? el.textContent;
    });

    // Update placeholders
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      el.placeholder = strings[el.dataset.i18nPlaceholder] ?? "";
    });

    // Re-render suggestions
    renderSuggestions();
  }

  function renderSuggestions() {
    const container = document.getElementById("suggestions");
    container.innerHTML = "";
    SUGGESTIONS[currentLang].forEach(({ label, items }) => {
      const heading = document.createElement("div");
      heading.className = "suggestion-group-label";
      heading.textContent = label;
      container.appendChild(heading);

      const group = document.createElement("div");
      group.className = "suggestion-group";
      items.forEach((text) => {
        const btn = document.createElement("button");
        btn.className = "suggestion-chip";
        btn.textContent = text;
        btn.onclick = () => {
          document.getElementById("queryInput").value = text;
          document.getElementById("queryInput").focus();
        };
        group.appendChild(btn);
      });
      container.appendChild(group);
    });
  }

  // ── Query ─────────────────────────────────────────────────────────────────
  async function submitQuery() {
    if (isLoading) return;

    const query = document.getElementById("queryInput").value.trim();
    if (!query) return;

    const strings = STRINGS[currentLang];
    setLoading(true);

    // Show loading skeleton
    const card = document.getElementById("responseCard");
    const body = document.getElementById("responseBody");
    card.style.display = "block";
    body.className = "response-body";
    body.innerHTML =
      '<div class="skeleton-line" style="width:80%"></div>' +
      '<div class="skeleton-line" style="width:60%"></div>' +
      '<div class="skeleton-line" style="width:70%"></div>';

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json, text/plain, text/html",
        },
        body: JSON.stringify({ query, language: currentLang }),
      });

      if (!res.ok) throw new Error("server");

      const raw = await res.text();

      let data = null;
      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch {
          // Non-JSON webhook responses are valid in some Activepieces flows.
          data = raw;
        }
      }

      const answer =
        (data && typeof data === "object" && data.answer) ||
        (data && typeof data === "object" && data.output) ||
        (data && typeof data === "object" && data.message) ||
        (data && typeof data === "object" && data?.data?.answer) ||
        (data && typeof data === "object" && data?.body?.answer) ||
        (typeof data === "string" ? data : "");

      if (!answer) {
        body.className = "response-body error";
        body.textContent =
          "Webhook returned an empty payload. In Activepieces, add a final step to return JSON like {\"answer\":\"...\"}.";
        return;
      }

      body.className = "response-body";
      body.innerHTML = answer;
    } catch (err) {
      body.className = "response-body error";
      body.textContent =
        err.message === "server" ? strings.errorServer : strings.errorNetwork;
    } finally {
      setLoading(false);
    }
  }

  function setLoading(loading) {
    isLoading = loading;
    document.getElementById("submitBtn").disabled = loading;
    document.getElementById("spinner").style.display = loading ? "block" : "none";
  }

  // Submit on Ctrl+Enter / Cmd+Enter
  document.getElementById("queryInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      submitQuery();
    }
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  setLang("en");
</script>

<!-- COMMENT OUT VOICE WIDGET
<elevenlabs-convai agent-id="agent_2201kk1gjbe7fahvzdsqbxemdfds"></elevenlabs-convai><script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
-->

<!-- ── Auth overlay ───────────────────────────────────────────────────────── -->
<div id="auth-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:2rem 2.5rem;width:320px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);">
    <div style="margin-bottom:1.25rem;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:40px;height:40px;margin:0 auto 0.5rem;display:block;">
        <circle cx="16" cy="16" r="15" fill="#E4002B" fill-opacity="0.9"/>
        <text x="16" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="sans-serif">ON</text>
      </svg>
      <h2 style="margin:0;font-size:1.1rem;font-weight:700;color:#1a1a1a;">Coke ON Analytics</h2>
    </div>
    <input
      type="password"
      id="auth-input"
      placeholder="Password"
      style="width:100%;box-sizing:border-box;padding:0.6rem 0.75rem;border:1px solid #ccc;border-radius:6px;font-size:1rem;margin-bottom:0.75rem;outline:none;"
    />
    <button
      id="auth-submit"
      style="width:100%;padding:0.65rem;background:#E4002B;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;"
    >Enter</button>
    <p id="auth-error" style="display:none;margin:0.6rem 0 0;color:#E4002B;font-size:0.85rem;">Incorrect password</p>
  </div>
</div>

<script>
  (function () {
    const SESSION_KEY = 'coke_on_auth';
    const overlay = document.getElementById('auth-overlay');

    if (sessionStorage.getItem(SESSION_KEY) === '1') return;

    overlay.style.display = 'flex';

    function attempt() {
      if (document.getElementById('auth-input').value === CONFIG.PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, '1');
        overlay.style.display = 'none';
      } else {
        document.getElementById('auth-error').style.display = 'block';
        document.getElementById('auth-input').value = '';
        document.getElementById('auth-input').focus();
      }
    }

    document.getElementById('auth-submit').addEventListener('click', attempt);
    document.getElementById('auth-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') attempt();
    });
  })();
</script>
</body>
</html>
